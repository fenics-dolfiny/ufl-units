stages:
  - build
  - lint
  - test

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true
  image: python:3.13
  tags:
    - zed
    - saas-linux-large-amd64

variables:
  FORCE_COLOR: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  DOLFINX_TAG: nightly
  DOLFINX_IMAGE: $CI_REGISTRY_IMAGE/dolfinx:$CI_COMMIT_REF_SLUG
  FIREDRAKE_TAG: latest
  FIREDRAKE_IMAGE: $CI_REGISTRY_IMAGE/firedrake:$CI_COMMIT_REF_SLUG

# Publish the development image to the project registry, for `test-dolfinx` to run on.
image-dolfinx:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - >-
      docker build --pull --build-arg DOLFINX_TAG="$DOLFINX_TAG"
      -f docker/Dockerfile.dolfinx -t "$DOLFINX_IMAGE" .
    - docker push "$DOLFINX_IMAGE"

# Publish the development image to the project registry, for `test-firedrake` to run on.
image-firedrake:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - >-
      docker build --pull --build-arg FIREDRAKE_TAG="$FIREDRAKE_TAG"
      -f docker/Dockerfile.firedrake -t "$FIREDRAKE_IMAGE" .
    - docker push "$FIREDRAKE_IMAGE"

ruff:
  stage: lint
  needs: [] # nothing to wait for, the image build is unrelated
  script:
    - pip install --group lint-format
    - ruff format --check
    - ruff check .

mypy:
  stage: lint
  needs: []
  script:
    - pip install --group lint-typing
    - pip install . --group test
    - mypy -p ufl_units
    - mypy test/ --explicit-package-bases

ty:
  stage: lint
  needs: []
  allow_failure: true # mypy is blocking
  script:
    - pip install --group lint-typing
    - pip install . --group test
    - ty check --color always src/ufl_units
    - ty check --color always test

typos:
  stage: lint
  needs: []
  image: python:3.13-slim
  script:
    - pip install --group lint-spell-check
    - typos

prettier:
  stage: lint
  needs: []
  image: node:current-alpine
  script:
    - npm install prettier prettier-plugin-toml
    - npx prettier . --check --plugin prettier-plugin-toml

test:
  stage: test
  needs: []
  script:
    - pip install . --group test
    - pytest -n auto test/
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_REF_SLUG-artifacts"
    paths:
      - "report.xml"
    reports:
      junit: report.xml
    expire_in: 2 hours

test-dolfinx:
  stage: test
  image: $DOLFINX_IMAGE
  needs:
    - image-dolfinx
  script:
    # As in the devcontainer, ufl-units goes in with --no-deps so that the image's own
    # fenics-ufl, fenics-basix and numpy stay in place.
    - pip install --group test
    - pip install --no-deps --no-build-isolation .
    - python -m pytest -n auto test/
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_REF_SLUG-artifacts"
    paths:
      - "report.xml"
    reports:
      junit: report.xml
    expire_in: 2 hours

test-firedrake:
  stage: test
  image: $FIREDRAKE_IMAGE
  needs:
    - image-firedrake
  script:
    # As in the devcontainer, ufl-units goes in with --no-deps so that the image's own
    # fenics-ufl, fenics-basix and numpy stay in place.
    - pip install --group test
    - pip install --no-deps --no-build-isolation .
    - python3 -m pytest -n auto test/
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_REF_SLUG-artifacts"
    paths:
      - "report.xml"
    reports:
      junit: report.xml
    expire_in: 2 hours
